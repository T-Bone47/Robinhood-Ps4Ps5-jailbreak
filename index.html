<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063f73"><title>Robinhood — PS4 Jailbreak Host</title><link rel="stylesheet" href="frontend/css/base.css"><link rel="stylesheet" href="frontend/css/ops-theme.css"><link rel="stylesheet" href="frontend/css/ps4-host.css"></head><body class="ps4-host"><header class="ps4-header"><h1 id="page-title">PS4 Jailbreak</h1><span id="build-badge" class="build-badge"></span></header><main class="ps4-main"><section id="firmware-picker" class="host-section"><div class="support-note"><strong>Robinhood PS4 Host</strong><span>Local firmware routing and utility interface</span></div><div class="host-health-row"><span id="health-badge" class="health-badge">Checking host…</span></div><div class="detect-row"><button id="auto-detect" class="secondary-button">AUTO DETECT FIRMWARE</button><span id="detect-result">Waiting for console detection…</span></div><div id="firmware-buttons" class="firmware-buttons" role="group" aria-label="Firmware"></div></section><section id="firmware-page" class="firmware-page hidden"><div class="firmware-heading"><button id="back" class="back-button">← Firmware</button><div><div class="eyebrow">Selected route</div><h2 id="firmware-title">PS4 Jailbreak</h2></div><span id="firmware-status" class="host-badge">LOCKED</span></div><div class="firmware-summary"><span><b id="summary-tools">0</b> tools</span><span><b id="summary-locked">0</b> locked</span><span id="summary-execution">LOCKED</span></div><div id="quick-actions" class="quick-actions"></div><div class="primary-action-wrap"><button id="primary-action" class="tool-button primary-tool">Exploit + GoldHEN</button></div><div class="tool-divider"></div><div id="tool-grid" class="tool-grid"></div><div class="host-console"><div class="console-title"><span>Robinhood status</span><span id="console-state">READY</span></div><pre id="host-log">Select an action.</pre></div></section></main><script src="frontend/js/host-status.js"></script><script src="frontend/js/firmware-session.js"></script><script src="frontend/js/navigation.js"></script><script src="frontend/js/build-info.js"></script><script src="frontend/js/host-health.js"></script><script src="frontend/js/firmware-summary.js"></script><script src="frontend/js/quick-actions.js"></script><script>
(async()=>{const data=await fetch('frontend/firmware-tool-catalog.json').then(r=>r.json());const picker=document.getElementById('firmware-picker'),page=document.getElementById('firmware-page'),title=document.getElementById('firmware-title'),pageTitle=document.getElementById('page-title'),status=document.getElementById('firmware-status'),grid=document.getElementById('tool-grid'),primary=document.getElementById('primary-action'),log=document.getElementById('host-log'),state=document.getElementById('console-state'),buttons=document.getElementById('firmware-buttons');document.getElementById('build-badge').textContent=`Robinhood ${RobinhoodBuildInfo.get().version}`;document.getElementById('health-badge').textContent=RobinhoodHostHealth.evaluate().status.replaceAll('_',' ');Object.keys(data.profiles).forEach(fw=>{const b=document.createElement('button');b.textContent=fw;b.dataset.firmware=fw;b.onclick=()=>showProfile(fw);buttons.appendChild(b)});function showProfile(fw){const p=data.profiles[fw];if(!p)return;picker.classList.add('hidden');page.classList.remove('hidden');title.textContent=p.title;pageTitle.textContent=p.title;status.textContent=p.executionState||'LOCKED';RobinhoodNavigation.firmware(fw);RobinhoodFirmwareSession.write({firmware:fw,profile:p.title,status:'ROUTE_SELECTED'});const cards=p.toolCards||[];document.getElementById('summary-tools').textContent=cards.length;document.getElementById('summary-locked').textContent=cards.filter(x=>x.state==='LOCKED_UNTIL_VALIDATED').length;document.getElementById('summary-execution').textContent=p.executionState||'LOCKED';document.getElementById('quick-actions').innerHTML='';grid.innerHTML='';cards.forEach(card=>{const b=document.createElement('button');b.className='tool-button utility-card';b.innerHTML=`<span>${card.name}</span><small>${card.category} · ${card.state}</small>`;b.onclick=()=>{RobinhoodHostStatus.set('LOCKED',`${card.name} selected — verified adapter required.`);state.textContent='LOCKED';log.textContent=`[+] ${card.name} selected\n[+] Firmware: ${fw}\n[!] Execution remains gated until hardware verification.`};grid.appendChild(b)});primary.textContent=p.primary||'Exploit + GoldHEN';primary.onclick=()=>{RobinhoodHostStatus.set('EXECUTION_WAITING',`${primary.textContent} request held behind the verified-adapter gate.`);state.textContent='EXECUTION_WAITING';log.textContent=`[+] ${primary.textContent}\n[+] Firmware route: ${fw}\n[!] Execution request held behind verification.`}}document.getElementById('back').onclick=()=>{page.classList.add('hidden');picker.classList.remove('hidden');pageTitle.textContent='PS4 Jailbreak';RobinhoodHostStatus.set('READY','Host ready.')};document.getElementById('auto-detect').onclick=()=>document.getElementById('detect-result').textContent='PS4 firmware could not be detected from this browser.'})();
</script></body></html>
