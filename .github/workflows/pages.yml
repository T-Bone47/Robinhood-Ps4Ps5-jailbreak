name: Deploy Robinhood Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Robinhood
        uses: actions/checkout@v4
        with:
          path: robinhood
          persist-credentials: false
      - name: Check out pinned WebKitty runtime
        uses: actions/checkout@v4
        with:
          repository: ArabPixel/WebKitty
          ref: 6b2f4df39fb427819d3a0ded282c7adc23643d5d
          path: webkitty
          persist-credentials: false
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble Pages artifact
        run: |
          mkdir -p public
          cp -a robinhood/. public/
          mkdir -p public/webkitty
          cp -a webkitty/. public/webkitty/
          rm -rf public/.git public/.github public/webkitty/.git
          test -f public/index.html
          test -f public/webkitty/index.html
          test -f public/webkitty/LICENSE
          test -f public/webkitty/includes/js/firmware.js
          test -f public/webkitty/includes/caches/manifest/1302-1352.manifest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
